# Infrastructure dependencies for local development.
#
#   docker compose up -d        # start Typesense
#
# Ollama is intentionally NOT containerised here — it commonly runs natively
# (often with GPU access). Install from https://ollama.com then:
#   ollama pull gemma3:4b
#
# The backend, MCP server, and frontend run from the host (see README).

services:
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    command: >
      --data-dir /data
      --api-key=xyz
      --enable-cors
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  typesense-data:
