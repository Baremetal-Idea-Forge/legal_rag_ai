[project]
name = "legal-rag-ai"
version = "0.0.3"
description = "Legal RAG AI — PDF ingestion, semantic search, and Q&A over legal documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",       # required for FastAPI file-upload endpoints
    # Settings / env
    "pydantic-settings>=2.14.1",
    # PDF extraction
    "pymupdf>=1.27.2.3",
    # LLM providers
    "google-genai>=1.0.0",
    # Embeddings
    "sentence-transformers>=5.5.1",
    "numpy>=2.4.6",
    "torch>=2.10.0",
    # Vector / full-text search
    "typesense>=2.0.0",
    "mcp>=1.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
# Linux: pull the CPU-only torch build from PyTorch's CPU index. The default
# Linux wheel on PyPI is the CUDA build (+cuXXX), which drags in `triton` and
# crashes on import on a GPU-less VPS. The +cpu build has no CUDA/triton and is
# ~200MB instead of ~2.5GB. macOS falls back to the default PyPI wheel (CPU/MPS).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
