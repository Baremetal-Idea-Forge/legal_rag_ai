[project]
name = "legal-rag-ai"
version = "0.1.0"
description = "Legal RAG AI — PDF ingestion, semantic search, and Q&A over legal documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",       # required for FastAPI file-upload endpoints
    # Settings / env
    "pydantic-settings>=2.14.1",
    # PDF extraction
    "pymupdf>=1.27.2.3",
    # Embeddings
    "sentence-transformers>=5.5.1",
    "numpy>=2.4.6",
    # PyTorch — ROCm build for AMD GPU (RX 9070 XT / RDNA4 gfx1201).
    # Pinned to the ROCm 7.0 index below; latest cp313 ROCm wheel is 2.10.0.
    # triton-rocm is torch's companion (only on the ROCm index) — declared so
    # the source mapping below resolves it instead of falling back to PyPI.
    "torch==2.10.0",
    "triton-rocm==3.6.0 ; sys_platform == 'linux'",
    # Vector / full-text search
    "typesense>=2.0.0",
    "mcp>=1.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
# torch's ROCm build pulls triton-rocm, which only lives on the same index.
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.0"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
